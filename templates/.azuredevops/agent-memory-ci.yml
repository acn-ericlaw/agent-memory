# agent-memory — vendor-neutral ritual floor, Azure DevOps member of the forge-aware set (v4.32.0).
# OWN-PIPELINE model: this file is a complete, self-contained pipeline — agent-memory never edits an
# existing azure-pipelines.yml (no include splicing needed; one repo can carry many pipelines, each
# bound to its own YAML).
#
# ACTIVATION IS NOT FILE-DRIVEN on this forge (the honest limit): committing this file is inert
# until a pipeline resource is bound to it — one documented, one-time step (default permission:
# Contributors, not admin), run AFTER this file has been pushed to the remote (az binds to the
# server-side YAML path; run early, the CLI falls into its interactive flow):
#   az pipelines create --name agent-memory --repository <repo-name> --repository-type tfsgit \
#     --branch <default-branch> --yml-path .azuredevops/agent-memory-ci.yml --skip-first-run
# After that, the trigger below runs it on every push. PR-time validation is a separate concern on
# Azure Repos (the YAML `pr:` key is ignored there): optionally add this pipeline as a Build
# Validation branch policy (its "Optional" mode = notify-only) — an admin settings step the tool
# never performs. Microsoft-hosted agents need parallelism — the free grant (Microsoft's request
# form) or paid parallel jobs via a linked Azure subscription — or use a self-hosted agent.
#
# Push-build note: Azure Pipelines exposes no pushed-range variable, so push builds check the TIP
# commit only — commit the session log together with (or after) the work so it rides the tip.
#
# Advisory by default: findings emit ##vso warnings and mark the run "partially succeeded"
# (orange — never blocks). Set the pipeline variable AGENT_MEMORY_STRICT to 1 to gate
# (findings then fail the run).

trigger:
  branches:
    include:
      - '*'

pool:
  vmImage: ubuntu-latest

jobs:
  - job: agent_memory
    displayName: agent-memory
    steps:
      - checkout: self
        fetchDepth: 0   # full history for the diff-based session-log check (new pipelines default to shallow=1)
      - bash: |
          status=0
          if [ -f agent-skills/memory-lint/scripts/memory-lint.py ]; then
            # --strict makes warnings observable to this wrapper; the wrapper then preserves
            # advisory-by-default behavior or fails when AGENT_MEMORY_STRICT=1.
            python3 agent-skills/memory-lint/scripts/memory-lint.py --strict || {
              echo "##vso[task.logissue type=warning]memory-lint reported issues (see log above)"
              status=1
            }
          else
            echo "memory-lint not installed; skipping."
          fi
          if [ "$BUILD_REASON" = "PullRequest" ]; then
            # a PR validation build checks out a merge commit; parent 1 is the target-branch tip
            base="$(git rev-parse --verify --quiet HEAD^1 2>/dev/null || echo '')"
          else
            base="$(git rev-parse --verify --quiet HEAD~1 2>/dev/null || echo '')"
          fi
          if [ -n "$base" ]; then
            changed="$(git diff --name-only "$base" HEAD 2>/dev/null || true)"
            work="$(printf '%s\n' "$changed" | grep -vE '^(memory/|\.agent/)' | grep -v '^$' || true)"
            logged="$(printf '%s\n' "$changed" | grep -E '^memory/sessions/.*\.md$' || true)"
            if [ -n "$work" ] && [ -z "$logged" ]; then
              echo "##vso[task.logissue type=warning]agent-memory ritual: changes touched tracked files but added no memory/sessions/ log — write or enrich a session log per AGENTS.md 'After Every Session'."
              status=1
            else
              echo "ritual check: ok"
            fi
          else
            echo "no base ref; skipping ritual check"
          fi
          if [ "$status" -ne 0 ]; then
            if [ "${AGENT_MEMORY_STRICT:-0}" = "1" ]; then
              echo "##vso[task.logissue type=error]agent-memory: findings failed the STRICT gate"
              exit 1
            fi
            echo "##vso[task.complete result=SucceededWithIssues;]agent-memory advisory findings"
          fi
        displayName: memory-lint + session-log presence (advisory)
